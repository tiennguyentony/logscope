[project]
name = "logscope"
version = "0.6.0"
description = "Command-line analysis of nginx access logs: summaries, latency percentiles and filtering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
logscope = "logscope.cli:run"

[project.optional-dependencies]
dev = [
    "pytest~=8.3.4",
]

[dependency-groups]
dev = [
    "pytest~=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
